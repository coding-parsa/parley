name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no models, no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Unit tests
        run: pytest tests/test_units.py -q
      - name: CLI wiring
        run: |
          python -c "from parley.cli import build_parser; build_parser().parse_args(['--help'])"
          python -c "from parley.duplex import Duplex, DuplexConfig; Duplex(DuplexConfig())"
